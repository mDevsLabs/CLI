name: Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 0.5.1 ou v0.5.1)"
        required: false
        type: string
  push:
    tags:
      - "desktop-v*"
      - "v*"
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "src/**"
      - "packages/**"
      - "dist/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Build CLI partagé (une fois, sur ubuntu)
  # ──────────────────────────────────────────────
  build-cli:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'desktop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build CLI
        run: bun run build

      - name: Upload CLI dist
        uses: actions/upload-artifact@330a01c490aca1516041387c5a2d8f2afc02ca # v4
        with:
          name: cli-dist
          path: dist/
          retention-days: 3

  # ──────────────────────────────────────────────
  # Build Desktop — matrice 3 OS
  # ──────────────────────────────────────────────
  build-desktop:
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-13
            platform: mac
            arch: x64
          - os: macos-14
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      # Python requis pour node-gyp / node-pty sur tous les OS
      - name: Setup Python (node-gyp)
        uses: actions/setup-python@a309ff8b426b58ec0ad9d40d3627a5233aa54a0 # v5
        with:
          python-version: "3.11"

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Download CLI dist
        uses: actions/download-artifact@fa0a91b85d4bd85d9de46e83082fa6b9ea42dc3 # v4
        with:
          name: cli-dist
          path: dist/

      - name: Install root deps (for dist integrity)
        run: bun install --frozen-lockfile

      - name: Install desktop deps
        working-directory: apps/desktop
        run: |
          # npm ci nécessite package-lock.json ; on utilise npm install si absent
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        shell: bash

      - name: Rebuild native modules (node-pty)
        working-directory: apps/desktop
        run: npx electron-rebuild -f -w node-pty

      - name: Build desktop (vite + electron-builder)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Désactive la signature Apple en CI sans certs (build ad-hoc)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build
          npx electron-builder --publish never --${{ matrix.platform }} --${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca1516041387c5a2d8f2afc02ca
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unpacked (debug)
        if: failure()
        uses: actions/upload-artifact@330a01c490aca1516041387c5a2d8f2afc02ca
        with:
          name: debug-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/release/
          retention-days: 3

  # ──────────────────────────────────────────────
  # Release (agrège les artifacts si tag)
  # ──────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4bd85d9de46e83082fa6b9ea42dc3
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
